<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Witness — Human-in-the-Loop Decision Desk</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel-2:#0f151d; --line:#1f2a37;
    --txt:#e6edf3; --muted:#8b98a5; --accent:#5b8cff; --ok:#2ecc71; --warn:#f2c14e; --bad:#ff6b6b; --info:#5bc0de;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#15233d 0%,var(--bg) 55%);color:var(--txt);
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  button{font:inherit;cursor:pointer}
  code{background:#0c1219;border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:12px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
       padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(11,15,20,.75);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7b5bff);display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
  .tagline{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}
  .topactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);padding:6px 11px;border-radius:999px;background:var(--panel-2)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok);animation:pulse 2s infinite}
  .dot.bad{background:var(--bad)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)}70%{box-shadow:0 0 0 8px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  .app{display:grid;grid-template-columns:340px 1fr;gap:0;max-width:1280px;margin:0 auto;min-height:calc(100vh - 53px)}
  aside{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
  .qhead{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .qlist{display:flex;flex-direction:column;gap:8px;overflow:auto}
  .qitem{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:linear-gradient(180deg,var(--panel),var(--panel-2));text-align:left;color:var(--txt);width:100%}
  .qitem:hover{border-color:#2b3d59}
  .qitem.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .qname{font-weight:600;font-size:13.5px}
  .qmeta{color:var(--muted);font-size:11.5px;margin-top:3px;display:flex;justify-content:space-between;gap:8px}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
  .pill.VERIFIED,.pill.APPROVED{color:#8ff0b5;border-color:#1f5a38;background:#0d2418}
  .pill.NEEDS_REVIEW{color:#ffe08a;border-color:#5a4a1f;background:#241f0d}
  .pill.DENIED{color:#ffb3b3;border-color:#5a1f1f;background:#240d0d}
  .pill.INFO_REQUESTED{color:#a9e4f2;border-color:#1f4a5a;background:#0d2024}
  .pill.OK{color:#8ff0b5;border-color:#1f5a38;background:#0d2418}
  .pill.ABSTAIN{color:#ffe08a;border-color:#5a4a1f;background:#241f0d}
  .pill.ELIGIBLE{color:#8ff0b5;border-color:#1f5a38;background:#0d2418}
  main{padding:20px 22px 60px;min-width:0}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:26px 0 10px}
  .muted{color:var(--muted)}
  .banner{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:linear-gradient(180deg,var(--panel),var(--panel-2));margin:14px 0}
  .banner.good{border-color:#1f5a38}
  .banner.warn{border-color:#5a4a1f}
  .banner.bad{border-color:#5a1f1f}
  .banner b{font-size:13.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .quote{color:#9fb3c8;font-style:italic}
  ul.reasons{margin:6px 0 0;padding-left:18px}
  ul.reasons li{margin:4px 0;color:#ffd9a0}
  details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);margin-top:8px}
  summary{cursor:pointer;color:var(--muted);font-size:12.5px}
  pre{white-space:pre-wrap;word-break:break-word;font-size:12.5px;color:#cdd9e5;margin:10px 0 0;line-height:1.5}
  .form{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(180deg,var(--panel),var(--panel-2))}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input,select,textarea{background:#0c1219;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 10px;font:inherit;width:100%}
  textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .field{flex:1;min-width:180px;display:flex;flex-direction:column;gap:5px}
  label{font-size:11.5px;color:var(--muted)}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#06101f;font-weight:700;border-radius:9px;padding:10px 14px}
  .btn.ghost{background:transparent;color:var(--txt);border-color:var(--line);font-weight:500}
  .btn.small{padding:6px 11px;font-size:12.5px;font-weight:500}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .audit{display:flex;flex-direction:column;gap:6px}
  .audit .e{display:flex;gap:10px;align-items:baseline;font-size:12.5px;border-bottom:1px dashed var(--line);padding:6px 0}
  .seq{color:var(--muted);min-width:34px}
  .hash{color:#7f8c99;font-family:ui-monospace,Consolas,monospace;font-size:11px}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.info{color:var(--info)}
  .conflict{border:1px solid #5a4a1f;border-radius:10px;padding:10px 12px;background:#1b1710;margin-bottom:8px}
  .conflict .k{font-weight:700;color:#ffe08a}
  .conflict table{font-size:12.5px}
  .metric{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
  .metric .card{border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(180deg,var(--panel),var(--panel-2))}
  .metric .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .metric .l{color:var(--muted);font-size:12px;margin-top:3px}
  .foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  @media(max-width:820px){.app{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo">W</div><span>Witness</span><span class="tagline">AI proposes · a check audits · a human decides</span></div>
  <div class="topactions">
    <button class="btn ghost small" onclick="showIntake()">New case</button>
    <button class="btn ghost small" onclick="showEval()">Evaluation</button>
    <button class="btn ghost small" onclick="showPolicy()">Policy</button>
    <div class="status"><span id="dot" class="dot"></span><span id="stat">checking API…</span></div>
  </div>
</div>

<div class="app">
  <aside>
    <div class="qhead">Officer queue <span id="qcount" class="muted"></span></div>
    <div id="qlist" class="qlist"></div>
    <div class="foot">
      <button id="verifyBtn" class="btn ghost" style="width:100%">Verify audit chain</button>
      <button id="tamperBtn" class="btn ghost" style="width:100%;margin-top:8px">Tamper demo</button>
      <div id="chain" class="muted" style="margin-top:8px;font-size:12.5px"></div>
      <button id="reseedBtn" class="btn ghost" style="width:100%;margin-top:10px">Reseed cases</button>
    </div>
  </aside>
  <main id="detail">
    <p class="muted">Select a case from the queue, or paste a new case to run the pipeline live.</p>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill = (s) => `<span class="pill ${esc(s)}">${esc(String(s ?? '—').replace(/_/g,' '))}</span>`;
const fmtAge = (m) => m == null ? '' : (m < 60 ? Math.round(m) + 'm' : Math.round(m/60*10)/10 + 'h');
let cases = [];
let current = null;

async function api(path, opts){
  const r = await fetch(path, Object.assign({cache:'no-store'}, opts));
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

async function pollHealth(){
  try{
    const j = await api('/health');
    $('dot').className = 'dot ok';
    $('stat').textContent = `API online · v${j.version} · stage ${j.stage}`;
  }catch(e){
    $('dot').className = 'dot bad';
    $('stat').textContent = 'API unreachable';
  }
}

async function loadQueue(){
  const data = await api('/api/cases');
  cases = data.cases;
  $('qcount').textContent = `(${data.stats.total})`;
  $('qlist').innerHTML = cases.map(c => `
    <button class="qitem ${current && current.id===c.id ? 'active' : ''}" onclick="openCase('${esc(c.id)}')">
      <div class="qname">${esc(c.applicant_name)}</div>
      <div class="qmeta"><span>${esc(c.id)}</span>${pill(c.status)}</div>
      <div class="qmeta"><span class="muted">${esc(c.province || '')}</span><span class="muted">${esc(c.outcome || '')}${c.verification ? ' · ' + esc(c.verification) : ''}</span></div>
      <div class="qmeta"><span class="muted">${c.assignee ? esc(c.assignee) : 'unassigned'}</span><span class="${c.sla_breached ? 'bad' : 'muted'}">${fmtAge(c.age_minutes)}${c.sla_breached ? ' · SLA' : ''}</span></div>
    </button>`).join('');
}

async function openCase(id){
  current = await api('/api/cases/' + encodeURIComponent(id));
  render();
  loadQueue();
}

function conflicts(c){
  const grouped = {};
  c.facts.forEach(f => { (grouped[f.key] = grouped[f.key] || []).push(f); });
  return Object.entries(grouped).filter(([, items]) => new Set(items.map(i => JSON.stringify(i.value))).size > 1);
}

function render(){
  const c = current;
  if(!c) return;
  const v = c.verification || {status:'—', reasons:[], checks:[]};
  const rec = c.recommendation || {outcome:'—', reasons:[]};
  const good = rec.outcome === 'ELIGIBLE';
  const decidable = c.status === 'VERIFIED' || c.status === 'NEEDS_REVIEW';
  const awaiting = c.status === 'INFO_REQUESTED';

  const facts = c.facts.map(f => {
    const cit = f.citation;
    const grounded = cit && cit.grounded;
    const quote = cit ? `“${esc(cit.quote)}” <span class="muted">(${esc(cit.doc_id)} ${cit.start}–${cit.end})</span>` : '<span class="bad">no citation</span>';
    const method = f.method ? `<span class="muted" style="font-size:11px">${esc(f.method)}</span>` : '';
    return `<tr>
      <td>${esc(f.label || f.key)} ${method}</td>
      <td><code>${esc(JSON.stringify(f.value))}</code></td>
      <td class="quote">${quote} ${grounded ? '<span class="ok">✓ verified</span>' : '<span class="bad">✗ unverified</span>'}</td>
    </tr>`;
  }).join('');

  const rules = c.rules.map(r => `<tr>
      <td><code>${esc(r.rule_id)}</code><div class="muted" style="font-size:11.5px">${esc(r.title)}</div></td>
      <td>${pill(r.status)}</td>
      <td class="muted">${esc(r.detail)}</td>
      <td class="muted" style="white-space:nowrap">${r.policy_ref ? esc(r.policy_ref) : '—'}</td>
    </tr>`).join('');

  const checks = v.checks.map(chk => `<div class="e"><span class="${chk.ok ? 'ok' : 'bad'}">${chk.ok ? '✓' : '✗'}</span><span>${esc(chk.check)} · ${esc(chk.fact)}</span><span class="muted">${esc(chk.note)}</span></div>`).join('');
  const reasons = (v.reasons && v.reasons.length) ? `<ul class="reasons">${v.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '<div class="ok">No issues found.</div>';

  const conflictList = conflicts(c);
  const conflictHtml = conflictList.length ? conflictList.map(([key, items]) => `
    <div class="conflict">
      <div class="k">${esc(key)} — ${items.length} conflicting values</div>
      <table><thead><tr><th>Value</th><th>Context</th><th>Quote</th></tr></thead><tbody>
        ${items.map(i => `<tr><td><code>${esc(JSON.stringify(i.value))}</code></td><td class="muted">${esc(i.citation ? i.citation.doc_id : '—')}</td><td class="quote">${esc(i.citation ? '“' + i.citation.quote + '”' : 'no citation')}</td></tr>`).join('')}
      </tbody></table>
    </div>`).join('') : '';

  const docs = c.documents.map(d => `<details><summary>${esc(d.title)} — ${esc(d.doc_id)}</summary><pre>${esc(d.text)}</pre></details>`).join('');

  const isOpen = decidable || awaiting;
  const assignHtml = isOpen ? `
    <form class="form" onsubmit="submitAssign(event)" style="margin-bottom:10px">
      <div class="row">
        <div class="field" style="max-width:280px"><label>Assign this case to an officer</label><input id="assignee" value="${esc(c.assignee || '')}" placeholder="Officer name" required /></div>
        <div style="display:flex;align-items:flex-end"><button class="btn ghost" type="submit">Assign</button></div>
      </div>
    </form>` : '';

  let decisionHtml;
  if(decidable){
    decisionHtml = `
      <form class="form" onsubmit="submitDecision(event)">
        <div class="row">
          <div class="field" style="max-width:220px"><label>Officer</label><input id="officer" placeholder="e.g. Officer A. Raza" required></div>
          <div class="field" style="max-width:220px"><label>Action</label>
            <select id="action">
              <option value="approve">Approve</option>
              <option value="deny">Deny</option>
              <option value="request_info">Request more info</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Written reason (required, recorded in the audit ledger)</label><textarea id="reason" placeholder="Explain the basis for this decision…" required></textarea></div>
        <div><button class="btn" type="submit">Record human decision</button></div>
      </form>`;
  }else if(awaiting){
    decisionHtml = `
      <div class="banner warn"><b>Awaiting information</b><div class="muted" style="margin-top:6px">${esc(c.decision ? c.decision.reason : '')} — resubmit new evidence to re-run the pipeline.</div></div>
      <form class="form" onsubmit="submitResubmit(event)">
        <div class="field"><label>New document title</label><input id="rTitle" value="Supplementary evidence" /></div>
        <div class="field"><label>New document text (form labels are picked up automatically)</label><textarea id="rText" placeholder="Monthly household income: PKR 40,000" required></textarea></div>
        <div><button class="btn" type="submit">Resubmit and re-run pipeline</button></div>
      </form>`;
  }else{
    decisionHtml = `
      <div class="form">
        <b>Decided by ${esc(c.decision ? c.decision.officer : '—')} → ${pill(c.status)}</b>
        <div class="muted">${esc(c.decision ? c.decision.reason : '')}</div>
        <div class="hash">${esc(c.decision ? c.decision.decided_at : '')}</div>
      </div>`;
  }

  $('detail').innerHTML = `
    <h1>${esc(c.applicant_name)} ${pill(c.status)}</h1>
    <div class="muted">${esc(c.id)} · CNIC ${esc(c.applicant_cnic || '—')} · ${esc(c.province || '—')}
      · assigned to <b>${esc(c.assignee || 'nobody')}</b>
      · age ${fmtAge(c.age_minutes)} ${c.sla_breached ? '<span class="bad">· SLA breached</span>' : ''}</div>

    <div class="banner ${good ? 'good' : (c.status==='DENIED' ? 'bad' : 'warn')}">
      <b>Pipeline recommendation: ${pill(rec.outcome)}</b>
      <div class="muted" style="margin-top:6px">${(rec.reasons || []).map(esc).join(' ')}</div>
      <div class="muted" style="margin-top:6px">The pipeline cannot deny. Lowest state is NEEDS_REVIEW; a denial requires the officer below.</div>
    </div>

    ${conflictHtml ? `<h2>Conflicting evidence</h2>${conflictHtml}` : ''}

    <h2>Extracted facts &amp; grounding</h2>
    <table><thead><tr><th>Field</th><th>Value</th><th>Citation</th></tr></thead><tbody>${facts}</tbody></table>

    <h2>Deterministic rules</h2>
    <table><thead><tr><th>Rule</th><th>Status</th><th>Detail</th><th>Policy clause</th></tr></thead><tbody>${rules}</tbody></table>
    <div class="muted" style="font-size:12px;margin-top:8px">Every rule cites the written clause it implements — see the <a href="#" onclick="showPolicy();return false" style="color:var(--accent)">policy</a>.</div>

    <h2>Independent verification ${pill(v.status)}</h2>
    ${reasons}
    <details><summary>Show ${v.checks.length} verification checks</summary><div class="audit">${checks}</div></details>

    <h2>Source documents</h2>
    ${docs}

    <h2>Human decision</h2>
    ${assignHtml}
    ${decisionHtml}

    <h2>Audit ledger</h2>
    <div id="audit" class="audit muted">loading…</div>
  `;
  loadAudit(c.id);
}

async function submitDecision(e){
  e.preventDefault();
  try{
    current = await api('/api/cases/' + encodeURIComponent(current.id) + '/decision', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({officer: $('officer').value.trim(), action: $('action').value, reason: $('reason').value.trim()})
    });
    render(); loadQueue();
  }catch(err){ alert('Decision rejected: ' + err.message); }
}

async function submitAssign(e){
  e.preventDefault();
  try{
    current = await api('/api/cases/' + encodeURIComponent(current.id) + '/assign', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({officer: $('assignee').value.trim()})
    });
    render(); loadQueue();
  }catch(err){ alert('Assign rejected: ' + err.message); }
}

async function submitResubmit(e){
  e.preventDefault();
  try{
    current = await api('/api/cases/' + encodeURIComponent(current.id) + '/resubmit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({documents:[{title: $('rTitle').value.trim() || 'Supplementary evidence', text: $('rText').value}]})
    });
    render(); loadQueue();
  }catch(err){ alert('Resubmit rejected: ' + err.message); }
}

async function loadAudit(id){
  try{
    const data = await api('/api/cases/' + encodeURIComponent(id) + '/audit');
    const el = $('audit'); if(!el) return;
    el.innerHTML = data.entries.map(e => `
      <div class="e"><span class="seq">#${e.seq}</span>
        <span><b>${esc(e.event)}</b>${e.actor ? ' · ' + esc(e.actor) : ''}</span>
        <span class="hash" title="${esc(e.hash)}">${esc(String(e.hash).slice(0,12))}…</span>
      </div>`).join('') || '<div class="muted">no entries</div>';
  }catch(err){}
}

async function verifyChain(){
  try{
    const r = await api('/api/audit/verify');
    $('chain').innerHTML = r.ok
      ? `<span class="ok">✓ audit chain intact</span> · ${r.checked} entries · head ${esc(String(r.head).slice(0,10))}…`
      : `<span class="bad">✗ chain broken at #${r.broken_at}</span>`;
  }catch(e){ $('chain').innerHTML = `<span class="bad">verify failed</span>`; }
}

async function tamper(){
  $('chain').innerHTML = '<span class="muted">tampering with a copy…</span>';
  try{
    const r = await api('/api/audit/tamper-demo', {method:'POST'});
    $('chain').innerHTML =
      `<span class="ok">✓ chain intact</span> (${r.intact.checked} entries)<br/>` +
      `<span class="bad">✗ forged copy detected at #${r.tampered.broken_at}</span><br/>` +
      `<span class="ok">✓ real ledger restored/untouched</span>`;
  }catch(e){ $('chain').innerHTML = `<span class="bad">tamper demo failed</span>`; }
}

async function reseed(){
  await api('/api/reseed', {method:'POST'});
  current = null;
  $('detail').innerHTML = '<p class="muted">Reseeded. Select a case from the queue.</p>';
  loadQueue();
}

function showIntake(){
  current = null;
  $('detail').innerHTML = `
    <h1>New case intake</h1>
    <p class="muted">Paste a case packet. The pipeline reads it, extracts facts from the standard form labels, grounds each one, then runs the rules and an independent check.</p>
    <form class="form" onsubmit="submitIntake(event)">
      <div class="row">
        <div class="field"><label>Applicant name</label><input id="iName" placeholder="e.g. Fatima Noor" required></div>
        <div class="field" style="max-width:200px"><label>CNIC (optional)</label><input id="iCnic" placeholder="35202-0000000-0" /></div>
        <div class="field" style="max-width:200px"><label>Province (optional)</label><input id="iProvince" placeholder="Punjab" /></div>
      </div>
      <div class="field"><label>Upload a PDF (optional — takes precedence over the text below)</label><input id="iPdf" type="file" accept="application/pdf" /></div>
      <div class="field"><label>Document 1 (text; ignored if a PDF is uploaded)</label><textarea id="iDoc1">Form B-1: Income Support Application
Name: Fatima Noor
Age: 46 years
Province of residence: Punjab
Household size: 6 persons
Monthly household income: PKR 38,000
Owns a car: No
Land owned (acres): 0
Bank balance: PKR 9,000</textarea></div>
      <div class="field"><label>Document 2 (optional — use it to show a contradiction)</label><textarea id="iDoc2" placeholder="e.g. a second income figure that conflicts with the first"></textarea></div>
      <div><button class="btn" type="submit">Run the pipeline</button></div>
    </form>`;
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('could not read file'));
    reader.readAsDataURL(file);
  });
}

async function submitIntake(e){
  e.preventDefault();
  let documents;
  const file = $('iPdf').files[0];
  try{
    if(file){
      const base64 = await fileToBase64(file);
      documents = [{title: file.name, pdf_base64: base64}];
    }else{
      const text = $('iDoc1').value.trim();
      if(!text){ alert('Provide a PDF or some document text.'); return; }
      documents = [{title:'Intake form', text}];
      const extra = $('iDoc2').value.trim();
      if(extra) documents.push({title:'Additional evidence', text: extra});
    }
    current = await api('/api/cases', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({applicant_name: $('iName').value.trim(), applicant_cnic: $('iCnic').value.trim(), province: $('iProvince').value.trim(), documents})
    });
    render(); loadQueue();
  }catch(err){ alert('Intake rejected: ' + err.message); }
}

async function showEval(){
  $('detail').innerHTML = '<p class="muted">Running the evaluation gate…</p>';
  try{
    const r = await api('/api/eval');
    const m = r.metrics;
    const inv = r.invariants;
    const rows = r.details.map(d => `
      <tr><td>${esc(d.id)}</td><td>${pill(d.status)}</td><td>${esc(d.outcome)}</td><td>${pill(d.verification)}</td>
      <td class="muted">${d.grounded}/${d.facts} grounded</td>
      <td class="muted">${d.checks.filter(c=>c.ok).length}/${d.checks.length} expectations</td></tr>`).join('');
    $('detail').innerHTML = `
      <h1>Evaluation gate ${r.all_passed ? '<span class="ok">✓ passed</span>' : '<span class="bad">✗ failed</span>'}</h1>
      <p class="muted">Reruns the pipeline over the seeded set and compares it to <code>data/eval/golden.json</code>. Source: ${esc(r.seed_source)}.</p>
      <div class="metric">
        <div class="card"><div class="n">${m.grounding_rate}</div><div class="l">Grounding rate (facts with a verbatim citation)</div></div>
        <div class="card"><div class="n">${m.abstain_rate}</div><div class="l">Abstain rate (cases escalated instead of guessed)</div></div>
        <div class="card"><div class="n">${m.expectations_met}/${m.expectations_total}</div><div class="l">Golden expectations met</div></div>
        <div class="card"><div class="n ${inv.no_auto_deny ? 'ok' : 'bad'}">${inv.no_auto_deny ? 'PASS' : 'FAIL'}</div><div class="l">Invariant: no case auto-denied (${inv.pre_human_statuses.join(', ')})</div></div>
      </div>
      <h2>Per-case results</h2>
      <table><thead><tr><th>Case</th><th>Status</th><th>Outcome</th><th>Verification</th><th>Grounding</th><th>Checks</th></tr></thead><tbody>${rows}</tbody></table>`;
  }catch(err){
    $('detail').innerHTML = `<p class="bad">Evaluation failed: ${esc(err.message)}</p>`;
  }
}

async function showPolicy(){
  $('detail').innerHTML = '<p class="muted">Loading policy…</p>';
  try{
    const r = await api('/api/policy');
    $('detail').innerHTML = `<h1>Rule set</h1><p class="muted">The exact Markdown shipped with the app (<code>data/policy/rules.md</code>).</p><pre>${esc(r.rules_markdown)}</pre>`;
  }catch(err){
    $('detail').innerHTML = `<p class="bad">Policy unavailable: ${esc(err.message)}</p>`;
  }
}
