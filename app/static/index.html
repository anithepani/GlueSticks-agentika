<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Case queue · Witness</title>
<meta name="description" content="Witness is a human-in-the-loop decision desk for high-stakes eligibility screening. AI proposes, an independent check audits, a human decides." />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='none' stroke='%231b4dd8' stroke-width='3'/%3E%3Crect x='11' y='11' width='10' height='10' rx='1' fill='%231b4dd8'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css?v=3" />
</head>
<body>
<a class="skip" href="#app">Skip to main content</a>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Witness</span>
      <span class="brand-sub">Eligibility decision desk</span>
    </div>

    <nav class="nav" aria-label="Main">
      <a href="#/cases" data-nav="cases">Cases</a>
      <a href="#/policy" data-nav="policy">Policy</a>
      <a href="#/quality" data-nav="quality">Quality</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>

    <div class="top-actions">
      <span class="live" id="live" role="status" title="Checking service status">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="live-text">Checking</span>
      </span>
      <a class="btn btn-primary" href="#/new">New case</a>
    </div>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1">
  <div class="view">
    <div class="skel" style="height:20px;width:220px;margin-bottom:12px"></div>
    <div class="skel" style="height:14px;width:380px;margin-bottom:22px"></div>
  </div>
</main>

<footer class="foot">
  <div class="foot-inner">
    <span>Glue Sticks · Agentika 2.0</span>
    <span class="sep">|</span>
    <span>Deployed on Alternate Clouds</span>
    <span class="sep">|</span>
    <span>Rules are synthetic and for demonstration only</span>
    <span class="right">
      <span>AI proposes · a check audits · a human decides</span>
    </span>
  </div>
</footer>

<noscript>
  <div style="max-width:720px;margin:40px auto;padding:0 24px">
    <h1>JavaScript is required</h1>
    <p>This decision desk runs in the browser. Enable JavaScript, or use the API directly:
      <code>/api/cases</code>, <code>/api/policy</code>, <code>/api/eval</code>.</p>
  </div>
</noscript>

<script src="/static/app.js?v=3" defer></script>
</body>
</html>
